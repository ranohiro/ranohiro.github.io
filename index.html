<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>週末の気分診断｜おすすめのおでかけスポットがわかるプチテスト</title>
  <style>
    :root {
      --primary: #334155;
      --accent: #f43f5e;
      --accent-soft: #fff1f2;
      --accent-text: #e11d48;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #f1f5f9;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 30px 22px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: var(--accent-soft);
      color: var(--accent-text);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 20px;
      line-height: 1.4;
      margin-bottom: 10px;
      color: #0f172a;
      font-weight: 800;
    }

    p.sub {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* 質問ナビゲーション（戻るボタン & ステップ表示） */
    .quiz-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      margin-left: -8px;
      border-radius: 8px;
      transition: all 0.15s ease;
    }

    .btn-back:active {
      background: #f1f5f9;
      color: var(--text);
    }

    .btn-back svg {
      width: 16px;
      height: 16px;
    }

    .q-step {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 700;
    }

    .progress-bar {
      height: 4px;
      background: #f1f5f9;
      border-radius: 2px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #fb7185;
      width: 0%;
      transition: width 0.3s ease;
    }

    .q-text {
      font-size: 16.5px;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.5;
      color: #0f172a;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      padding: 14px 16px;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .opt-btn:active {
      transform: scale(0.99);
      border-color: #fb7185;
      background: var(--accent-soft);
    }

    .opt-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #cbd5e1;
      flex-shrink: 0;
    }

    .opt-btn:active .opt-dot {
      background: #fb7185;
    }

    .btn-main {
      width: 100%;
      padding: 15px;
      background: #1e293b;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-main:active {
      opacity: 0.85;
    }

    /* ローディング演出 */
    .loading-box {
      padding: 36px 10px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #f1f5f9;
      border-top-color: #fb7185;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }

    /* 結果画面 */
    .result-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .mood-type {
      font-size: 13px;
      color: var(--accent-text);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .mood-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .spot-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px 16px;
      margin-bottom: 20px;
      text-align: left;
    }

    .spot-label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
    }

    .spot-title {
      font-size: 17.5px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .spot-desc {
      font-size: 13px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .spot-point {
      background: #ffffff;
      border: 1px solid #edf2f7;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #334155;
      margin-bottom: 10px;
    }

    .spot-point strong {
      color: var(--accent-text);
      margin-right: 4px;
    }

    .result-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      font-size: 11px;
      background: #e2e8f0;
      padding: 2px 7px;
      border-radius: 5px;
      color: #475569;
    }

    .share-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-retry {
      background: transparent;
      border: 1px solid #cbd5e1;
      color: var(--text-muted);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- スタート画面 -->
  <div id="screen-start" class="card">
    <span class="badge">WEEKEND MOOD</span>
    <h1>今週末の気分診断</h1>
    <p class="sub">5問の直感テストに答えると、<br>今の気分にぴったりなおでかけ先が分かります。</p>
    <button class="btn-main" onclick="startQuiz()">診断をはじめる</button>
  </div>

  <!-- 質問画面 -->
  <div id="screen-quiz" class="card hidden">
    <div class="quiz-nav">
      <button class="btn-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>戻る</span>
      </button>
      <div id="q-step" class="q-step">Q1 / 5</div>
    </div>
    <div class="progress-bar">
      <div id="progress" class="progress-fill"></div>
    </div>
    <div id="q-text" class="q-text">質問テキスト</div>
    <div id="options" class="options"></div>
  </div>

  <!-- ローディング画面 -->
  <div id="screen-loading" class="card hidden">
    <div class="loading-box">
      <div class="spinner"></div>
      <div class="loading-text">ぴったりのスポットを探しています...</div>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="screen-result" class="card hidden">
    <div id="res-icon" class="result-icon">✨</div>
    <div id="mood-type" class="mood-type">気分タイプ</div>
    <p id="mood-desc" class="mood-desc">解説テキスト</p>

    <div class="spot-box">
      <div class="spot-label">おすすめスポット</div>
      <div id="spot-title" class="spot-title">スポット名</div>
      <div id="spot-desc" class="spot-desc">スポット説明</div>
      <div class="spot-point">
        <strong>Point</strong><span id="spot-point-text">見どころ</span>
      </div>
      <div id="res-tags" class="result-tags"></div>
    </div>

    <div class="share-box">
      <button class="btn-main" onclick="copyResult()">結果を共有する（LINE等）</button>
      <button class="btn-retry" onclick="restart()">もう一度診断する</button>
    </div>
  </div>
</div>

<script>
  // 5つの行き先タイプ
  // movie: 109シネマズプレミアム新宿 (ゆったり贅沢)
  // immersive: イマーシブ・フォート東京 (刺激・非日常)
  // dialogue: ダイアログ・イン・ザ・ダーク (静寂・感覚)
  // artbar: Artbar Tokyo (アート・遊び心)
  // bbq: 豊洲ぐるり公園BBQ (開放感・自然体)

  const questions = [
    {
      text: "カフェで席を選ぶなら、どこが一番落ち着く？",
      choices: [
        { text: "外の風を感じられるオープンテラス", weights: { bbq: 2, artbar: 1 } },
        { text: "ソファのある落ち着いた奥の角席", weights: { movie: 2, dialogue: 1 } },
        { text: "照明控えめで静かな半個室", weights: { dialogue: 2, movie: 1 } },
        { text: "本や雑貨が並ぶ棚の近くの席", weights: { artbar: 2, immersive: 1 } },
        { text: "街の様子がよく見える窓際席", weights: { immersive: 2, bbq: 1 } }
      ]
    },
    {
      text: "旅先の雑貨屋さんで、ふと目に留まったアイテムは？",
      choices: [
        { text: "優しい音色の小さなオルゴール", weights: { movie: 2, dialogue: 1 } },
        { text: "光にかざすと綺麗なガラス玉", weights: { artbar: 2, bbq: 1 } },
        { text: "アンティークの真鍮の鍵", weights: { immersive: 2, artbar: 1 } },
        { text: "深い色合いの丸い天然石", weights: { dialogue: 2, movie: 1 } },
        { text: "いい香りがするハーブサシェ", weights: { bbq: 2, dialogue: 1 } }
      ]
    },
    {
      text: "忙しい1週間が終わった夜、一番ホッとする瞬間は？",
      choices: [
        { text: "上質な映画や作品の世界に浸っているとき", weights: { movie: 2, dialogue: 1 } },
        { text: "予想外の面白い展開や動画に出会ったとき", weights: { immersive: 2, bbq: 1 } },
        { text: "静かな部屋で、好きな音楽を聴いているとき", weights: { dialogue: 2, movie: 1 } },
        { text: "思い立って何かを作ったり描いたりするとき", weights: { artbar: 2, immersive: 1 } },
        { text: "美味しいごはんを食べてお腹いっぱいになったとき", weights: { bbq: 2, artbar: 1 } }
      ]
    },
    {
      text: "誰かと一緒に過ごすとき、心地いいなと感じる時間は？",
      choices: [
        { text: "言葉がなくても気まずくない、穏やかな沈黙", weights: { dialogue: 2, movie: 1 } },
        { text: "「これ見て！」とお互いの好みを共有する時間", weights: { artbar: 2, immersive: 1 } },
        { text: "初めての体験に一緒にワクワクしている時間", weights: { immersive: 2, bbq: 1 } },
        { text: "ちょっと特別な空間で、ゆったりくつろぐ時間", weights: { movie: 2, dialogue: 1 } },
        { text: "気取らず自然体で、たくさん笑い合える時間", weights: { bbq: 2, artbar: 1 } }
      ]
    },
    {
      text: "もし「どこでも行けるチケット」をもらえたら？",
      choices: [
        { text: "水辺の風が心地いいテラスデッキ", weights: { bbq: 2, dialogue: 1 } },
        { text: "雑音のない静かな星空の下", weights: { dialogue: 2, movie: 1 } },
        { text: "映画の世界に入り込める秘密のシアター", weights: { immersive: 2, artbar: 1 } },
        { text: "お酒と絵の具が並ぶおしゃれなアトリエ", weights: { artbar: 2, movie: 1 } },
        { text: "ふかふかソファのプレミアムラウンジ", weights: { movie: 2, immersive: 1 } }
      ]
    }
  ];

  const results = {
    movie: {
      icon: "🎬",
      moodType: "【ゆったり贅沢気分】",
      moodDesc: "今週末は、少し落ち着いて上質な世界観に浸りたい気分。日常の忙しさを忘れて、心地よい空間でリラックスするのがおすすめです。",
      title: "109シネマズプレミアム新宿",
      desc: "坂本龍一氏監修の最高峰音響と、全席プレミアムシートが揃う映画館。専用ラウンジでドリンクを楽しみながら、贅沢な映画体験が味わえます。",
      point: "上映前の専用ラウンジでゆったり過ごせます",
      tags: ["#プレミアムシート", "#音響最高峰", "#新宿", "#落ち着く空間"]
    },
    immersive: {
      icon: "🎭",
      moodType: "【ワクワク・刺激気分】",
      moodDesc: "今週末は、いつもの日常から抜け出してドキドキしたい気分！思いがけない展開や新しい体験に飛び込むと、一気にリフレッシュできそうです。",
      title: "イマーシブ・フォート東京",
      desc: "物語の登場人物として世界観に入り込める完全没入型テーマパーク。歩き回りながらサスペンスや謎解きを体験できる、新感覚のスポットです。",
      point: "2人でハラハラを共有できて会話が盛り上がります",
      tags: ["#没入型エンタメ", "#お台場", "#体験型", "#非日常"]
    },
    dialogue: {
      icon: "🕯️",
      moodType: "【静けさ・感覚リフレッシュ気分】",
      moodDesc: "画面や情報から少し離れて、感覚を研ぎ澄ましたい気分。静かな環境で誰かと落ち着いた時間を過ごすと、心が軽くなりそうです。",
      title: "ダイアログ・イン・ザ・ダーク",
      desc: "純度100%の暗闇の中を、声や手探りで進む体験。普段使わない感覚が研ぎ澄まされ、相手の声のトーンや存在感が温かく感じられます。",
      point: "普段と全く違う特別な会話が生まれます",
      tags: ["#完全な暗闇", "#五感の体験", "#竹芝", "#不思議な感覚"]
    },
    artbar: {
      icon: "🎨",
      moodType: "【クリエイティブ・遊び心気分】",
      moodDesc: "今週末は、頭を空っぽにして自由に楽しみたい気分！ちょっとしたお酒やものづくりなど、気取らずに笑い合える時間がぴったりです。",
      title: "Artbar Tokyo",
      desc: "ワインやドリンクを片手に、キャンバスに絵を描くアトリエ体験。絵が上手でなくても気軽に楽しめて、描いた作品はそのまま持ち帰れます。",
      point: "ワインを飲みながら手ぶらで楽しめます",
      tags: ["#ワイン片手にアート", "#代官山", "#手ぶらOK", "#おしゃれアトリエ"]
    },
    bbq: {
      icon: "🍖",
      moodType: "【開放感・リフレッシュ気分】",
      moodDesc: "広い空の下で、深呼吸してのんびり過ごしたい気分。美味しいものを食べながら、肩の力を抜いて過ごすのが一番のパワーチャージです。",
      title: "豊洲ぐるり公園 手ぶらBBQ",
      desc: "海風が気持ちいいウォーターフロントで楽しめる、準備・片付け不要のバーベキュー。開放感ある景色を眺めながら、気楽に美味しいごはんを楽しめます。",
      point: "手ぶらで行けて景色も抜群です",
      tags: ["#手ぶらBBQ", "#海沿い", "#豊洲", "#開放感"]
    }
  };

  let currentQ = 0;
  let scores = { movie: 0, immersive: 0, dialogue: 0, artbar: 0, bbq: 0 };
  let answerHistory = [];

  function startQuiz() {
    scores = { movie: 0, immersive: 0, dialogue: 0, artbar: 0, bbq: 0 };
    answerHistory = [];
    currentQ = 0;
    document.getElementById("screen-start").classList.add("hidden");
    document.getElementById("screen-quiz").classList.remove("hidden");
    showQuestion();
  }

  function showQuestion() {
    const q = questions[currentQ];
    document.getElementById("q-step").innerText = `Q${currentQ + 1} / ${questions.length}`;
    document.getElementById("q-text").innerText = q.text;
    document.getElementById("progress").style.width = `${((currentQ) / questions.length) * 100}%`;

    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";

    q.choices.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      
      const dot = document.createElement("span");
      dot.className = "opt-dot";

      const text = document.createElement("span");
      text.innerText = c.text;

      btn.appendChild(dot);
      btn.appendChild(text);
      btn.onclick = () => selectChoice(c.weights);
      optionsContainer.appendChild(btn);
    });
  }

  function selectChoice(weights) {
    answerHistory.push(weights);
    for (const [type, pts] of Object.entries(weights)) {
      scores[type] = (scores[type] || 0) + pts;
    }

    currentQ++;
    if (currentQ < questions.length) {
      showQuestion();
    } else {
      document.getElementById("progress").style.width = "100%";
      showLoading();
    }
  }

  function goBack() {
    if (currentQ > 0) {
      // 直前の回答を取り消して前の質問へ
      const lastWeights = answerHistory.pop();
      if (lastWeights) {
        for (const [type, pts] of Object.entries(lastWeights)) {
          scores[type] = (scores[type] || 0) - pts;
        }
      }
      currentQ--;
      showQuestion();
    } else {
      // Q1ならスタート画面に戻る
      document.getElementById("screen-quiz").classList.add("hidden");
      document.getElementById("screen-start").classList.remove("hidden");
    }
  }

  function showLoading() {
    document.getElementById("screen-quiz").classList.add("hidden");
    document.getElementById("screen-loading").classList.remove("hidden");

    setTimeout(() => {
      document.getElementById("screen-loading").classList.add("hidden");
      showResult();
    }, 800);
  }

  function showResult() {
    document.getElementById("screen-result").classList.remove("hidden");

    let topType = "movie";
    let maxScore = -1;
    let candidateTypes = [];

    for (const [key, val] of Object.entries(scores)) {
      if (val > maxScore) {
        maxScore = val;
        topType = key;
        candidateTypes = [key];
      } else if (val === maxScore) {
        candidateTypes.push(key);
      }
    }

    if (candidateTypes.length > 1) {
      const randIdx = Math.floor(Math.random() * candidateTypes.length);
      topType = candidateTypes[randIdx];
    }

    const res = results[topType];
    document.getElementById("res-icon").innerText = res.icon;
    document.getElementById("mood-type").innerText = res.moodType;
    document.getElementById("mood-desc").innerText = res.moodDesc;
    document.getElementById("spot-title").innerText = res.title;
    document.getElementById("spot-desc").innerText = res.desc;
    document.getElementById("spot-point-text").innerText = res.point;

    const tagsContainer = document.getElementById("res-tags");
    tagsContainer.innerHTML = "";
    res.tags.forEach(t => {
      const span = document.createElement("span");
      span.className = "tag";
      span.innerText = t;
      tagsContainer.appendChild(span);
    });
  }

  function copyResult() {
    const mood = document.getElementById("mood-type").innerText;
    const title = document.getElementById("spot-title").innerText;
    const shareText = `週末気分診断やってみたら『${mood}』で、おすすめは「${title}」だった！ここ行ってみたい笑\nhttps://ranohiro.github.io/`;

    if (navigator.share) {
      navigator.share({
        title: "週末の気分診断",
        text: shareText,
        url: "https://ranohiro.github.io/"
      }).catch(() => {
        fallbackCopy(shareText);
      });
    } else {
      fallbackCopy(shareText);
    }
  }

  function fallbackCopy(text) {
    navigator.clipboard.writeText(text).then(() => {
      alert("結果をコピーしました！LINE等に貼り付けて送れます。");
    }).catch(() => {
      prompt("以下のテキストをコピーしてください:", text);
    });
  }

  function restart() {
    currentQ = 0;
    scores = { movie: 0, immersive: 0, dialogue: 0, artbar: 0, bbq: 0 };
    answerHistory = [];
    document.getElementById("screen-result").classList.add("hidden");
    document.getElementById("screen-start").classList.remove("hidden");
  }
</script>
</body>
</html>
